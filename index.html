<style>
    body {
        font-family: 'Nunito', sans-serif;
        background: linear-gradient(135deg, #fff2e6 0%, #ffe6ea 50%, #f0f4ff 100%);
        min-height: 100vh;
    }

    .heading-font {
        font-family: 'Fredoka', cursive;
    }

    .card-shadow {
        box-shadow: 0 20px 40px -15px rgba(255, 138, 160, 0.25);
    }

    .badge-pulse {
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
</style>


<main class="w-full max-w-md bg-white rounded-3xl overflow-hidden card-shadow border-4 border-pink-100 transition-all duration-300 hover:shadow-2xl">
    <!-- Header / Banner -->
    <div class="h-32 bg-gradient-to-r from-pink-300 via-purple-300 to-indigo-300 relative">
        <div class="absolute top-4 right-4 bg-white/80 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-pink-600 shadow-sm badge-pulse">
            <i class="fa-solid fa-heart text-pink-500 mr-1"></i> Perfil NFC
        </div>
    </div>

    <!-- Perfil Content -->
    <div class="px-6 pb-8 relative">
        <!-- Avatar / Foto de Perfil (Gato) -->
        <div class="relative -mt-16 mb-4 flex justify-center">
            <div class="relative">
                <img src="tugato.jpg" alt="Foto de mi gato" class="w-32 h-32 rounded-full object-cover border-4 border-white shadow-md">
                <span class="absolute bottom-1 right-1 bg-green-500 border-2 border-white w-5 h-5 rounded-full flex items-center justify-center shadow" title="En casa">
                    <span class="w-2 h-2 bg-white rounded-full"></span>
                </span>
            </div>
        </div>

        <!-- Nombre e Info Principal -->
        <div class="text-center mb-6">
            <h1 class="heading-font text-3xl font-bold text-gray-800 flex items-center justify-center gap-2">
                Daisy <i class="fa-solid fa-paw text-pink-400 text-xl"></i>
            </h1>
            <p class="text-pink-500 font-semibold text-sm mt-1">¡Hola, soy tu mascota favorita!</p>
        </div>

        <!-- Detalles / Características -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-pink-50 p-3 rounded-2xl text-center border border-pink-100">
                <span class="block text-xs text-pink-400 font-bold uppercase tracking-wider">Especie</span>
                <span class="heading-font text-gray-700 font-semibold text-base">Gato 🐱</span>
            </div>
            <div class="bg-purple-50 p-3 rounded-2xl text-center border border-purple-100">
                <span class="block text-xs text-purple-400 font-bold uppercase tracking-wider">Estado</span>
                <span class="heading-font text-gray-700 font-semibold text-base">Amado ❤️</span>
            </div>
        </div>

        <!-- Botones de Contacto -->
        <div class="space-y-3">
            <a href="#" class="w-full bg-gradient-to-r from-pink-500 to-rose-400 hover:from-pink-600 hover:to-rose-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-pink-200 transition-all duration-200 flex items-center justify-center gap-3 text-base">
                <i class="fa-solid fa-phone text-lg"></i>
                Llamar a mi dueño
            </a>

            <a href="#" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-emerald-100 transition-all duration-200 flex items-center justify-center gap-3 text-base">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                Enviar WhatsApp
            </a>
        </div>

        <!-- Footer con aviso -->
        <div class="mt-6 text-center border-t border-gray-100 pt-4">
            <p class="text-xs text-gray-400 flex items-center justify-center gap-1">
                <i class="fa-solid fa-shield-cat text-pink-300"></i> Si me encontraste, por favor contáctanos.
            </p>
        </div>
    </div>
</main>
