<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Daisy 🐾</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fff2e6 0%, #ffe6ea 50%, #f0f4ff 100%);
            min-height: 100vh;
        }

        .heading-font {
            font-family: 'Fredoka', cursive;
        }

        /* Pulse animation for important alerts */
        @keyframes gentle-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .pulse-card {
            animation: gentle-pulse 3s infinite ease-in-out;
        }

        /* Float animation for background elements */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .floating {
            animation: float 4s ease-in-out infinite;
        }

        .floating-delayed {
            animation: float 5s ease-in-out infinite 2s;
        }

        /* WhatsApp Button Gradient & Hover */
        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            box-shadow: 0 10px 20px -5px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
        }
        
        .btn-whatsapp:active {
            transform: scale(0.98);
        }

        /* Decorative paw background patterns */
        .paw-pattern {
            background-image: radial-gradient(#ffb5a7 1px, transparent 1px), radial-gradient(#fcd5ce 1px, #fff2e6 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            opacity: 0.15;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Background floating decorative icons -->
    <div class="fixed top-6 left-6 text-pink-300 opacity-60 text-3xl floating pointer-events-none select-none">
        <i class="fa-solid fa-paw"></i>
    </div>
    <div class="fixed top-20 right-8 text-amber-300 opacity-70 text-2xl floating-delayed pointer-events-none select-none">
        <i class="fa-solid fa-bone"></i>
    </div>
    <div class="fixed bottom-12 left-10 text-rose-300 opacity-60 text-2xl floating-delayed pointer-events-none select-none">
        <i class="fa-solid fa-heart"></i>
    </div>
    <div class="fixed bottom-8 right-6 text-pink-300 opacity-60 text-3xl floating pointer-events-none select-none">
        <i class="fa-solid fa-paw"></i>
    </div>

    <main class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border-2 border-pink-100 overflow-hidden relative z-10 my-auto">
        
        <!-- Header Banner with gradient and decorative shapes -->
        <div class="bg-gradient-to-r from-pink-400 via-rose-400 to-amber-300 h-32 relative flex items-center justify-center">
            <!-- Pattern overlay -->
            <div class="absolute inset-0 paw-pattern"></div>
            
            <!-- Top tag badge -->
            <div class="absolute top-3 bg-white/90 px-4 py-1 rounded-full shadow-sm flex items-center gap-2 border border-pink-200">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs font-bold text-gray-700 uppercase tracking-wider">Mascota Encontrada</span>
            </div>
        </div>

        <div class="px-6 pb-6 pt-0 text-center relative">
            
            <!-- Avatar Container -->
            <div class="relative w-32 h-32 mx-auto -mt-16 mb-4">
                <div class="w-full h-full rounded-full border-4 border-white shadow-lg bg-pink-100 overflow-hidden flex items-center justify-center relative">
                    <!-- Dog Illustration fallback / default image -->
                    <svg class="w-24 h-24 text-pink-400" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/>
                    </svg>
                    <!-- Visual Paw Icon Avatar -->
                    <div class="absolute inset-0 bg-gradient-to-b from-amber-100 to-pink-100 flex items-center justify-center">
                        <i class="fa-solid fa-dog text-6xl text-rose-400"></i>
                    </div>
                </div>
                <!-- Badge Icon -->
                <div class="absolute bottom-1 right-1 bg-amber-400 text-white p-2 rounded-full shadow-md border-2 border-white flex items-center justify-center w-8 h-8">
                    <i class="fa-solid fa-heart text-xs"></i>
                </div>
            </div>

            <!-- Pet Name -->
            <h1 class="heading-font text-4xl font-bold text-gray-800 mb-1 flex items-center justify-center gap-2">
                Daisy
                <span class="text-pink-400 text-2xl"><i class="fa-solid fa-sparkles"></i></span>
            </h1>

            <!-- Owner Info Badge -->
            <div class="inline-flex items-center gap-2 px-3 py-1 bg-rose-50 border border-rose-100 rounded-full text-rose-700 text-sm font-semibold mb-6">
                <i class="fa-solid fa-user-heart"></i>
                <span>Dueño: <strong class="text-rose-900">Matias Colman</strong></span>
            </div>

            <div class="pulse-card bg-amber-50/80 border-2 border-amber-200/70 rounded-2xl p-4 mb-6 relative text-left shadow-sm">
                <div class="absolute -top-3 left-4 bg-amber-400 text-white text-xs font-bold px-2.5 py-0.5 rounded-md flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-comment-dots"></i> Mensaje Importante
                </div>
                <p class="text-gray-700 text-base leading-relaxed font-medium pt-1 text-center italic">
                    "¡Hola! Si me encontraste, por favor avísale a mi dueño."
                </p>
            </div>

            <div class="space-y-3">
                <a href="https://wa.me/543834788463?text=Hola%20Matias,%20encontr%C3%A9%20a%20Daisy" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="btn-whatsapp w-full py-4 px-6 rounded-2xl text-white font-bold text-lg flex items-center justify-center gap-3 transition-transform duration-200 transform hover:-translate-y-0.5">
                    <i class="fa-brands fa-whatsapp text-2xl"></i>
                    <span>Contactar por WhatsApp</span>
                </a>

                <!-- Phone Direct Call Option -->
                <a href="tel:+543834788463" 
                   class="w-full py-3 px-6 rounded-2xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-sm flex items-center justify-center gap-2 transition-colors duration-200">
                    <i class="fa-solid fa-phone text-rose-500"></i>
                    <span>Llamar directamente: +54 383 478-8463</span>
                </a>
            </div>

            <div class="mt-6 pt-6 border-t border-gray-100 grid grid-cols-2 gap-3 text-xs font-semibold text-gray-500">
                <div class="bg-gray-50 p-2.5 rounded-xl flex items-center justify-center gap-2 border border-gray-100">
                    <i class="fa-solid fa-shield-heart text-pink-400 text-sm"></i>
                    <span>Mascota Protegida</span>
                </div>
                <div class="bg-gray-50 p-2.5 rounded-xl flex items-center justify-center gap-2 border border-gray-100">
                    <i class="fa-solid fa-location-dot text-rose-400 text-sm"></i>
                    <span>Aviso Inmediato</span>
                </div>
            </div>

        </div>

        <!-- Footer Decorator -->
        <div class="bg-rose-50/50 py-3 text-center border-t border-pink-100/50 text-xs text-rose-400 font-medium flex items-center justify-center gap-1">
            <span>Hecho con</span>
            <i class="fa-solid fa-heart text-rose-500"></i>
            <span>para volver a casa</span>
        </div>

    </main>

</body>
</html>
